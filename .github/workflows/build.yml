name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI & Build
        run: |
          Invoke-RestMethod "https://geode-sdk.org/install.ps1" | Invoke-Expression
          geode build --all-platforms
